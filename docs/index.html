<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bathroom Cleaning Log</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#dde1e6;--ac:#0f6e56;--ok:#0f6e56;--no:#b3261e;--okbg:#dff3ec;--nobg:#fbe3e1}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14171a;--card:#1d2125;--tx:#e8eaed;--mu:#9aa4af;--bd:#333a41;--ac:#3fbf9d;--ok:#5fd3b0;--no:#ff8a80;--okbg:#14352c;--nobg:#3d1d1a}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;padding:11px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.big button{padding:20px 8px;font-size:18px;font-weight:600}
.yes{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.nop{background:var(--nobg);color:var(--no);border-color:var(--no)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}.tag.y{background:var(--okbg);color:var(--ok)}.tag.n{background:var(--nobg);color:var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:130px}
.mu{color:var(--mu);font-size:13px}.err{color:var(--no);font-size:14px;margin-top:8px}.okm{color:var(--ok);font-weight:600}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.q{text-align:center;border:1px solid var(--bd);border-radius:10px;padding:10px;background:#fff;color:#000;break-inside:avoid}
.q .c{display:flex;justify-content:center}.q b{display:block;font-size:13px;margin-top:6px}
@media print{body *{visibility:hidden}.qrs,.qrs *{visibility:visible}.qrs{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<main id="app"><p class="mu">Loading…</p></main>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let BATH=[],bById={},me=null,token="",needsSetup=false,users=[],logs=[],last=[],tab="clean",msg="",err="",qrBase="",filt={d:"",b:"",u:"",s:""};
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>{const d=new Date(t);return d.toLocaleDateString([],{year:"numeric",month:"short",day:"2-digit"})+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})};
const CFG=window.CONFIG||{};
const rpc=async(fn,args={})=>{
  const r=await fetch(CFG.SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:CFG.SUPABASE_KEY},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||"Request failed");return j;
};
const ls={get(){try{return localStorage.getItem("bc_token")||""}catch(e){return""}},set(v){try{v?localStorage.setItem("bc_token",v):localStorage.removeItem("bc_token")}catch(e){}}};
const hashId=()=>{const h=location.hash.slice(1);return bById[h]?h:""};
let scanned="";
window.addEventListener("hashchange",()=>{scanned=hashId();render()});

async function boot(){
  if(!CFG.SUPABASE_KEY||CFG.SUPABASE_KEY.startsWith("PASTE"))throw new Error("Add your Supabase public key in config.js.");
  BATH=await rpc("app_bathrooms");bById=Object.fromEntries(BATH.map(b=>[b.id,b]));scanned=hashId();
  needsSetup=await rpc("app_status");token=ls.get();
  if(token){try{me=await rpc("app_me",{t:token});await load()}catch(e){token="";ls.set("");me=null}}
  render();
  setInterval(async()=>{if(me&&me.role==="admin"&&["status","logs"].includes(tab)&&!document.activeElement.matches("input,select,textarea")){try{await load();render()}catch(e){}}},30000);
}
async function load(){
  logs=await rpc("app_logs",{t:token});
  if(me.role==="admin"){last=await rpc("app_last",{t:token});users=await rpc("app_users",{t:token});if(!scanned&&tab==="clean")tab="status"}
}
const fd=f=>Object.fromEntries(new FormData(f));

function loginView(){return `<div class="card"><h1>Bathroom Cleaning Log</h1><p class="mu">${needsSetup?"First-time setup: create the administrator account.":"Sign in with your staff ID and password."}</p>
<form id="lf">${needsSetup?'<label>Admin name</label><input name="name" autocomplete="name">':""}<label>User ID</label><input name="id" autocomplete="username" autocapitalize="none" required>
<label>Password</label><input name="pw" type="password" autocomplete="current-password" required><div class="err">${esc(err)}</div>
<p><button class="p" type="submit" style="width:100%">${needsSetup?"Create admin":"Sign in"}</button></p></form></div>`}
function cleanView(){
  const b=bById[scanned];
  const opts=["New Block","Old Block"].map(k=>`<optgroup label="${k}">${BATH.filter(x=>x.blk===k).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</optgroup>`).join("");
  const mine=logs.filter(l=>l.uid===me.id).slice(0,8);
  return `<div class="card">${msg?`<p class="okm">${esc(msg)}</p>`:""}${err?`<p class="err">${esc(err)}</p>`:""}
${b?`<h2>${esc(b.name)}</h2><p class="mu">${b.blk} · ${b.id}</p><label>Remark (optional)</label><textarea id="note" rows="2"></textarea>
<div class="big"><button class="yes" data-a="rec" data-s="cleaned">✔ Cleaned</button><button class="nop" data-a="rec" data-s="not cleaned">✖ Not cleaned</button></div><p class="mu">Date and time are recorded automatically by the server.</p>`
:`<h2>Scan a bathroom QR code</h2><p class="mu">Scan the code on the bathroom door, or pick the bathroom manually:</p><select id="pick"><option value="">Choose bathroom…</option>${opts}</select>`}</div>
${mine.length?`<div class="card"><h2>My recent entries</h2><div class="sc"><table>${mine.map(l=>`<tr><td>${fmt(l.ts)}</td><td>${esc(l.bname)}</td><td><span class="tag ${l.status==="cleaned"?"y":"n"}">${l.status}</span></td></tr>`).join("")}</table></div></div>`:""}`}
function statusView(){
  const m=Object.fromEntries(last.map(l=>[l.bid,l])),today=new Date().toDateString();
  const done=BATH.filter(b=>m[b.id]&&m[b.id].status==="cleaned"&&new Date(m[b.id].ts).toDateString()===today).length;
  return `<div class="card"><h2>Latest status per bathroom</h2><p class="mu">${done} of ${BATH.length} marked cleaned today.</p><div class="sc"><table><tr><th>Block</th><th>Bathroom</th><th>Status</th><th>Date &amp; time</th><th>By</th></tr>
${BATH.map(b=>{const l=m[b.id];return `<tr><td>${b.blk}</td><td>${esc(b.name)}</td><td>${l?`<span class="tag ${l.status==="cleaned"?"y":"n"}">${l.status}</span>`:'<span class="mu">no record</span>'}</td><td>${l?fmt(l.ts):"–"}</td><td>${l?esc(l.uname):""}</td></tr>`}).join("")}</table></div></div>`}
function filtered(){return logs.filter(l=>(!filt.d||new Date(l.ts).toLocaleDateString("en-CA")===filt.d)&&(!filt.b||l.bid===filt.b)&&(!filt.u||l.uid===filt.u)&&(!filt.s||l.status===filt.s))}
function logsView(){const rows=filtered();
  return `<div class="card"><h2>All entries</h2><div class="row"><div><label>Date</label><input type="date" data-f="d" value="${filt.d}"></div>
<div><label>Bathroom</label><select data-f="b"><option value="">All</option>${BATH.map(b=>`<option value="${b.id}" ${filt.b===b.id?"selected":""}>${esc(b.name)} (${b.id})</option>`).join("")}</select></div>
<div><label>Staff</label><select data-f="u"><option value="">All</option>${users.map(u=>`<option value="${esc(u.id)}" ${filt.u===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select></div>
<div><label>Status</label><select data-f="s"><option value="">All</option><option ${filt.s==="cleaned"?"selected":""}>cleaned</option><option ${filt.s==="not cleaned"?"selected":""}>not cleaned</option></select></div></div>
<p><button data-a="xlsx">Download Excel (${rows.length})</button></p><div class="sc"><table><tr><th>Date &amp; time</th><th>Bathroom</th><th>Status</th><th>Staff</th><th>Remark</th></tr>
${rows.slice(0,300).map(l=>`<tr><td>${fmt(l.ts)}</td><td>${esc(l.bname)} <span class="mu">${l.bid}</span></td><td><span class="tag ${l.status==="cleaned"?"y":"n"}">${l.status}</span></td><td>${esc(l.uname)} <span class="mu">${esc(l.uid)}</span></td><td>${esc(l.note)}</td></tr>`).join("")}</table></div></div>`}
function staffView(){return `<div class="card"><h2>Add staff</h2><form id="uf"><div class="row"><div><label>Name</label><input name="name"></div><div><label>User ID</label><input name="id" autocapitalize="none" required></div><div><label>Password</label><input name="pw" required></div><div><label>Role</label><select name="role"><option value="cleaner">Cleaner</option><option value="admin">Admin</option></select></div></div>
<div class="err">${esc(err)}</div><p class="okm">${esc(msg)}</p><button class="p" type="submit">Add user</button></form></div>
<div class="card"><h2>Users (${users.length})</h2><div class="sc"><table>${users.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${u.role}</td><td>${u.id!==me.id?`<button data-a="pw" data-id="${esc(u.id)}">New password</button> <button data-a="del" data-id="${esc(u.id)}">Remove</button>`:"you"}</td></tr>`).join("")}</table></div></div>`}
function qrView(){if(!qrBase)qrBase=location.href.split("#")[0];
  return `<div class="card"><h2>QR codes</h2><p class="mu">One unique code per bathroom. If the app is served from another address (for example a public URL), change the link below, then print.</p><label>App link</label><input id="qb" value="${esc(qrBase)}"><p><button class="p" data-a="qrgo">Update codes</button> <button data-a="print">Print</button></p></div>
<div class="qrs">${BATH.map(b=>`<div class="q"><div class="c" id="q-${b.id}"></div><b>${esc(b.name)}</b><span style="font-size:12px">${b.blk} · ${b.id}</span></div>`).join("")}</div>`}
function drawQr(){if(typeof QRCode==="undefined")return;BATH.forEach(b=>{const el=document.getElementById("q-"+b.id);if(el){el.innerHTML="";new QRCode(el,{text:qrBase.replace(/#.*$/,"")+"#"+b.id,width:120,height:120})}})}

function render(){
  if(!me){app.innerHTML=loginView();return}
  const adm=me.role==="admin";
  if(!adm||scanned)tab="clean";
  const tabs=(adm?[["status","Status"],["logs","Entries"],["staff","Staff"],["qr","QR codes"]]:[]).concat([["clean","Record cleaning"]]);
  app.innerHTML=`<div class="top"><div><h1>Bathroom Cleaning Log</h1><span class="mu">${esc(me.name)} · ${me.role}</span></div><button data-a="out">Sign out</button></div>
${tabs.length>1?`<div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</div>`:""}
${tab==="clean"?cleanView():tab==="status"?statusView():tab==="logs"?logsView():tab==="staff"?staffView():qrView()}`;
  if(tab==="qr")drawQr();
}
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=fd(e.target);err="";msg="";
  try{
    if(e.target.getAttribute("id")==="lf"){
      const r=needsSetup?await rpc("app_setup",{i:f.id,n:f.name||"",p:f.pw}):await rpc("app_login",{i:f.id,p:f.pw});
      token=r.token;ls.set(token);me={id:r.id,name:r.name,role:r.role};needsSetup=false;await load();
    }
    if(e.target.getAttribute("id")==="uf"){await rpc("app_add_user",{t:token,i:f.id,n:f.name,p:f.pw,r:f.role});msg="User added.";users=await rpc("app_users",{t:token})}
  }catch(x){err=x.message}
  render();
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-t]");if(t){tab=t.dataset.t;msg="";err="";scanned="";history.replaceState(null,"",location.pathname+location.search);if(me.role==="admin"){try{await load()}catch(x){}}return render()}
  const a=e.target.closest("[data-a]");if(!a)return;const act=a.dataset.a;err="";
  try{
    if(act==="out"){try{await rpc("app_logout",{t:token})}catch(x){}token="";ls.set("");me=null;tab="clean";render()}
    if(act==="rec"){const r=await rpc("app_log",{t:token,b:scanned,s:a.dataset.s,n:($("#note")||{}).value||""});
      msg=(a.dataset.s==="cleaned"?"Saved: CLEANED – ":"Saved: NOT cleaned – ")+r.bname+" at "+fmt(r.ts);scanned="";history.replaceState(null,"",location.pathname+location.search);await load();render()}
    if(act==="xlsx"){
      if(typeof XLSX==="undefined")throw new Error("Excel library could not load. Check the internet connection and try again.");
      const H=["Date","Time","Block","Bathroom ID","Bathroom","Status","Staff ID","Staff name","Remark"];
      const rows=filtered().map(r=>{const d=new Date(r.ts);return {"Date":d.toLocaleDateString("en-GB"),"Time":d.toLocaleTimeString("en-GB"),"Block":r.blk,"Bathroom ID":r.bid,"Bathroom":r.bname,"Status":r.status,"Staff ID":r.uid,"Staff name":r.uname,"Remark":r.note||""}});
      const ws=XLSX.utils.json_to_sheet(rows,{header:H});ws["!cols"]=[{wch:12},{wch:10},{wch:11},{wch:11},{wch:30},{wch:12},{wch:12},{wch:22},{wch:30}];
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Cleaning log");
      XLSX.writeFile(wb,"cleaning-log-"+new Date().toLocaleDateString("en-CA")+".xlsx");
    }
    if(act==="print")window.print();
    if(act==="qrgo"){qrBase=$("#qb").value.trim();drawQr()}
    if(act==="pw"){const p=prompt("New password for "+a.dataset.id+" (6+ characters):");if(p){await rpc("app_set_pw",{t:token,i:a.dataset.id,p});msg="Password changed.";render()}}
    if(act==="del"&&confirm("Remove user "+a.dataset.id+"?")){await rpc("app_del_user",{t:token,i:a.dataset.id});users=await rpc("app_users",{t:token});render()}
  }catch(x){err=x.message;render()}
});
document.addEventListener("change",e=>{
  if(e.target.getAttribute("id")==="pick"&&e.target.value){scanned=e.target.value;msg="";render()}
  if(e.target.dataset.f){filt[e.target.dataset.f]=e.target.value;render()}
});
boot().catch(x=>{app.innerHTML='<div class="card"><h2>Cannot start</h2><p>'+esc(x.message)+'</p></div>'});
</script>
</body>
</html>
